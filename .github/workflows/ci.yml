name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Without this, the first failing leg cancels the others and the Windows
      # results — the whole reason the matrix exists — are never reported.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci --ignore-scripts
      - run: npm test
      # The coverage threshold flags need Node >= 22.8, so the floor runs on the
      # Node 22 legs only. It guards the bridge and provider adapters, where the
      # delegate → apply bugs lived while every test stayed green.
      - name: Coverage floor (bridge + providers)
        if: matrix.node-version == 22
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-include="src/bridge/**"
          --test-coverage-include="src/providers/**"
          --test-coverage-lines=70
          --test-coverage-branches=55
          --test-coverage-functions=60
